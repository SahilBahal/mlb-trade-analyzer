<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Trade Analyzer 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .team-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #1e3c72;
        }

        .team-header h2 {
            color: #1e3c72;
            font-size: 1.8em;
        }

        .team-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #2a5298;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #1e3c72;
        }

        .player-list {
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .player-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }

        .player-details {
            font-size: 0.9em;
            color: #666;
            margin-top: 4px;
        }

        .player-value {
            font-weight: bold;
            color: #2a5298;
            font-size: 1.1em;
        }

        .selected-players {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
            min-height: 100px;
        }

        .selected-players h3 {
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .selected-player {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            background: #1e3c72;
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .selected-player:hover {
            background: #c62828;
            transform: scale(1.05);
        }

        .analyze-section {
            text-align: center;
            margin: 30px 0;
        }

        .analyze-btn {
            padding: 20px 60px;
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #43a047 0%, #66bb6a 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(67, 160, 71, 0.4);
        }

        .analyze-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(67, 160, 71, 0.6);
        }

        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .results-section {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 30px;
            display: none;
        }

        .results-section.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .probability-display {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .probability-number {
            font-size: 5em;
            font-weight: bold;
            margin: 20px 0;
        }

        .fairness-rating {
            font-size: 1.5em;
            margin-top: 10px;
        }

        .recommendation {
            font-size: 1.2em;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .insights-section {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .insights-section h3 {
            color: #1e3c72;
            margin-bottom: 15px;
        }

        .insight-item {
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-left: 4px solid #43a047;
            border-radius: 5px;
            font-size: 1em;
        }

        .trade-metadata {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            padding: 20px;
            background: #e3f2fd;
            border-radius: 10px;
        }

        .metadata-item {
            text-align: center;
        }

        .metadata-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .metadata-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #1e3c72;
        }

        .trade-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .team-details {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .team-details h3 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .detail-player {
            padding: 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #1e3c72;
        }

        .detail-player-name {
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
        }

        .detail-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
            color: white;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #1e3c72;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .trade-details {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚾ MLB Trade Analyzer</h1>
            <p class="subtitle">2025 Season - Analyze Trade Probabilities Based on Player Value</p>
        </header>

        <div class="main-content">
            <!-- Team 1 Section -->
            <div class="team-section">
                <div class="team-header">
                    <h2>Team 1</h2>
                    <span class="team-value" id="team1-value">Value: 0</span>
                </div>
                
                <input 
                    type="text" 
                    class="search-box" 
                    id="search1" 
                    placeholder="Search for players (e.g., Aaron Judge, Ohtani)..."
                >
                
                <div class="player-list" id="players1"></div>
                
                <div class="selected-players">
                    <h3>Selected Players:</h3>
                    <div id="selected1"></div>
                </div>
            </div>

            <!-- Team 2 Section -->
            <div class="team-section">
                <div class="team-header">
                    <h2>Team 2</h2>
                    <span class="team-value" id="team2-value">Value: 0</span>
                </div>
                
                <input 
                    type="text" 
                    class="search-box" 
                    id="search2" 
                    placeholder="Search for players (e.g., Mookie Betts, Soto)..."
                >
                
                <div class="player-list" id="players2"></div>
                
                <div class="selected-players">
                    <h3>Selected Players:</h3>
                    <div id="selected2"></div>
                </div>
            </div>
        </div>

        <div class="analyze-section">
            <button class="analyze-btn" id="analyzeBtn" disabled>
                Analyze Trade Probability
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing trade scenario...</p>
        </div>

        <div class="results-section" id="results">
            <div class="probability-display">
                <h2>Trade Probability</h2>
                <div class="probability-number" id="probability">0%</div>
                <div class="fairness-rating" id="fairness"></div>
                <div class="recommendation" id="recommendation"></div>
            </div>

            <div class="trade-details">
                <div class="team-details">
                    <h3>Team 1 Details</h3>
                    <div id="team1-details"></div>
                    <p style="margin-top: 15px; font-weight: bold; font-size: 1.2em;">
                        Total Value: <span id="team1-total-value"></span>
                    </p>
                </div>

                <div class="team-details">
                    <h3>Team 2 Details</h3>
                    <div id="team2-details"></div>
                    <p style="margin-top: 15px; font-weight: bold; font-size: 1.2em;">
                        Total Value: <span id="team2-total-value"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let team1Selected = [];
        let team2Selected = [];
        let allPlayers = [];

        // Load all players on page load
        async function loadPlayers() {
            try {
                const response = await fetch('/api/players');
                allPlayers = await response.json();
                displayPlayers(allPlayers, 'players1');
                displayPlayers(allPlayers, 'players2');
            } catch (error) {
                console.error('Error loading players:', error);
            }
        }

        // Display players in list
        function displayPlayers(players, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            players.slice(0, 50).forEach(player => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-item';
                const warDisplay = player.war ? player.war.toFixed(1) : '0.0';
                playerDiv.innerHTML = `
                    <div class="player-info">
                        <div class="player-name">${player.name}</div>
                        <div class="player-details">
                            ${player.team} • ${player.position} • Age ${player.age} • WAR: ${warDisplay}
                        </div>
                    </div>
                    <div class="player-value">${player.value.toFixed(2)}</div>
                `;
                
                playerDiv.onclick = () => {
                    if (containerId === 'players1') {
                        addPlayer(player, 1);
                    } else {
                        addPlayer(player, 2);
                    }
                };
                
                container.appendChild(playerDiv);
            });
        }

        // Search functionality
        document.getElementById('search1').addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length > 0) {
                const response = await fetch(`/api/players?query=${query}`);
                const players = await response.json();
                displayPlayers(players, 'players1');
            } else {
                displayPlayers(allPlayers, 'players1');
            }
        });

        document.getElementById('search2').addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length > 0) {
                const response = await fetch(`/api/players?query=${query}`);
                const players = await response.json();
                displayPlayers(players, 'players2');
            } else {
                displayPlayers(allPlayers, 'players2');
            }
        });

        // Add player to team
        function addPlayer(player, team) {
            const selected = team === 1 ? team1Selected : team2Selected;
            
            if (selected.some(p => p.name === player.name)) {
                alert('Player already selected!');
                return;
            }
            
            if (team === 1) {
                team1Selected.push(player);
            } else {
                team2Selected.push(player);
            }
            
            updateSelectedPlayers();
            updateAnalyzeButton();
        }

        // Remove player from team
        function removePlayer(playerName, team) {
            if (team === 1) {
                team1Selected = team1Selected.filter(p => p.name !== playerName);
            } else {
                team2Selected = team2Selected.filter(p => p.name !== playerName);
            }
            
            updateSelectedPlayers();
            updateAnalyzeButton();
        }

        // Update selected players display
        function updateSelectedPlayers() {
            // Team 1
            const selected1 = document.getElementById('selected1');
            selected1.innerHTML = '';
            let total1 = 0;
            
            team1Selected.forEach(player => {
                const span = document.createElement('span');
                span.className = 'selected-player';
                span.textContent = `${player.name} (${player.value.toFixed(1)})`;
                span.onclick = () => removePlayer(player.name, 1);
                selected1.appendChild(span);
                total1 += player.value;
            });
            
            document.getElementById('team1-value').textContent = `Value: ${total1.toFixed(2)}`;
            
            // Team 2
            const selected2 = document.getElementById('selected2');
            selected2.innerHTML = '';
            let total2 = 0;
            
            team2Selected.forEach(player => {
                const span = document.createElement('span');
                span.className = 'selected-player';
                span.textContent = `${player.name} (${player.value.toFixed(1)})`;
                span.onclick = () => removePlayer(player.name, 2);
                selected2.appendChild(span);
                total2 += player.value;
            });
            
            document.getElementById('team2-value').textContent = `Value: ${total2.toFixed(2)}`;
        }

        // Update analyze button state
        function updateAnalyzeButton() {
            const btn = document.getElementById('analyzeBtn');
            btn.disabled = team1Selected.length === 0 || team2Selected.length === 0;
        }

        // Analyze trade
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            loading.classList.add('show');
            results.classList.remove('show');
            
            try {
                const response = await fetch('/api/analyze-trade', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        team1: team1Selected.map(p => p.name),
                        team2: team2Selected.map(p => p.name)
                    })
                });
                
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error analyzing trade:', error);
                alert('Error analyzing trade. Please try again.');
            } finally {
                loading.classList.remove('show');
            }
        });

        // Display results
        function displayResults(data) {
            const results = document.getElementById('results');
            const prob = data.probability.probability;
            
            // Set probability color
            const probDisplay = document.getElementById('probability');
            probDisplay.textContent = `${prob}%`;
            probDisplay.style.color = prob > 75 ? '#4caf50' : prob > 50 ? '#ff9800' : '#f44336';
            
            document.getElementById('fairness').textContent = data.probability.fairness_rating;
            document.getElementById('recommendation').textContent = data.probability.recommendation;
            
            // Team 1 details
            const team1Details = document.getElementById('team1-details');
            team1Details.innerHTML = '';
            data.details.team1.forEach(player => {
                const div = document.createElement('div');
                div.className = 'detail-player';
                const stats = player.PlayerType === 'Batter' 
                    ? `AVG: ${player.AVG.toFixed(3)}, HR: ${player.HR}, WAR: ${player.WAR.toFixed(1)}`
                    : `ERA: ${player.ERA.toFixed(2)}, SO: ${player.SO}, WAR: ${player.WAR.toFixed(1)}`;
                
                div.innerHTML = `
                    <div class="detail-player-name">${player.Name}</div>
                    <div class="detail-stats">
                        <span>${player.Position} • Age ${player.Age}</span>
                        <span>Value: ${player.Value.toFixed(2)}</span>
                    </div>
                    <div class="detail-stats">
                        <span>${stats}</span>
                    </div>
                `;
                team1Details.appendChild(div);
            });
            document.getElementById('team1-total-value').textContent = data.probability.team1_value.toFixed(2);
            
            // Team 2 details
            const team2Details = document.getElementById('team2-details');
            team2Details.innerHTML = '';
            data.details.team2.forEach(player => {
                const div = document.createElement('div');
                div.className = 'detail-player';
                const stats = player.PlayerType === 'Batter' 
                    ? `AVG: ${player.AVG.toFixed(3)}, HR: ${player.HR}, WAR: ${player.WAR.toFixed(1)}`
                    : `ERA: ${player.ERA.toFixed(2)}, SO: ${player.SO}, WAR: ${player.WAR.toFixed(1)}`;
                
                div.innerHTML = `
                    <div class="detail-player-name">${player.Name}</div>
                    <div class="detail-stats">
                        <span>${player.Position} • Age ${player.Age}</span>
                        <span>Value: ${player.Value.toFixed(2)}</span>
                    </div>
                    <div class="detail-stats">
                        <span>${stats}</span>
                    </div>
                `;
                team2Details.appendChild(div);
            });
            document.getElementById('team2-total-value').textContent = data.probability.team2_value.toFixed(2);
            
            results.classList.add('show');
            results.scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize
        loadPlayers();
    </script>
</body>
</html>
